# Copy to config/deploy.<name>.yml (gitignored) and fill in your own details.
servers:
  web:
    - 203.0.113.10

proxy:
  host: jam.example.com
  # Only behind Cloudflare's proxy (orange cloud): keep its X-Forwarded-For so rate limits
  # see each visitor. See config/initializers/cloudflare.rb.
  # forward_headers: true

image: your-github-user/jambook
registry:
  server: ghcr.io
  username: your-github-user
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: deploy
