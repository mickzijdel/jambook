# Groups: minor/patch bumps land in one PR per ecosystem (majors keep their own), and every
# security fix lands together, so a one-gem PR can't fail bundler-audit on the other vulnerable
# gems still on main. The 7-day cooldown is what zizmor's dependabot-cooldown audit requires.
version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    gems:
      patterns: ["*"]
      update-types: [minor, patch]
    gems-security:
      applies-to: security-updates
      patterns: ["*"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
  groups:
    actions:
      patterns: ["*"]
      update-types: [minor, patch]
    actions-security:
      applies-to: security-updates
      patterns: ["*"]
