# Kamal deploy config shared by every install. Each install is a destination with its own
# server, domain and registry: copy config/deploy.example.yml to config/deploy.<name>.yml
# (gitignored) and deploy with `bin/kamal deploy -d <name>`.
service: jambook
image: jambook
require_destination: true

# Solid Queue runs inside Puma; there is no separate job server.
env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true

# Let's Encrypt certificate for the destination's proxy.host.
proxy:
  ssl: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# SQLite databases (songs, live updates, cache, queue) live on this volume.
volumes:
  - "jambook_storage:/rails/storage"

# Bridge fingerprinted assets between versions during zero-downtime deploys.
asset_path: /rails/public/assets

builder:
  arch: amd64
